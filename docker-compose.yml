services:
  postgres:
    image: pgvector/pgvector:pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-market_intelligence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market_intelligence}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      MI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-market_intelligence}:${POSTGRES_PASSWORD:-market_intelligence}@postgres:5432/${POSTGRES_DB:-market_intelligence}
      MI_LOG_LEVEL: ${MI_LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

volumes:
  postgres_data:
