[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-infrastructure-market-intelligence"
version = "0.1.0"
description = "Evidence-first market intelligence for AI and data-infrastructure companies"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "Portfolio Project" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pgvector>=0.3,<1",
  "prefect>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "tenacity>=9.0,<10",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
data = ["dbt-postgres>=1.9,<2"]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
market-intelligence-api = "market_intelligence.api.main:run"
market-intelligence-ingest-github = "market_intelligence.ingestion.cli:main"
market-intelligence-flow = "market_intelligence.orchestration.github_flow:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_intelligence"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["market_intelligence"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["prefect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a running PostgreSQL database",
]
